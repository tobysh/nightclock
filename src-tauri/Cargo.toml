[package]
name = "nightclock"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tiny_http = "0.12"
local-ip-address = "0.6"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1"

[lib]
name = "nightclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
